name: Android feature build

on:
  push:
    branches:
      - feature/watch-gt5-spo2-stress-temperature
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-feature-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "cmdline-tools;latest"
          SDK_MANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "${SDK_MANAGER}" --list --channel=3             | grep -E "^(platforms;android-37|build-tools;37\\.)"             || true
          "${SDK_MANAGER}" --channel=3             "platforms;android-37"             "build-tools;37.0.0"

      - name: Verify required Gradle tasks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:tasks --all --console=plain > "${RUNNER_TEMP}/app-gradle-tasks.txt"
          for task in             compileMainlineDebugKotlin             compileMainlineDebugJavaWithJavac             testMainlineDebugUnitTest             assembleMainlineDebug
          do
            if ! grep -Eq "^\\s*${task}(\\s|$)" "${RUNNER_TEMP}/app-gradle-tasks.txt"; then
              echo "::error::Required Gradle task not found: ${task}"
              grep -iE "main(line)?.*(debug|unit|assemble|compile)" "${RUNNER_TEMP}/app-gradle-tasks.txt" || true
              exit 1
            fi
          done

      - name: Compile mainline debug sources
        run: >
          ./gradlew
          :app:compileMainlineDebugKotlin
          :app:compileMainlineDebugJavaWithJavac
          --no-daemon
          --no-parallel
          --stacktrace

      - name: Run SelfHostedHealth payload tests
        run: >
          ./gradlew
          :app:testMainlineDebugUnitTest
          --tests "nodomain.freeyourgadget.gadgetbridge.util.selfhostedhealth.SelfHostedHealthPayloadTest"
          --no-daemon
          --no-parallel
          --stacktrace

      - name: Build installable mainline debug APK
        run: >
          ./gradlew
          :app:assembleMainlineDebug
          --no-daemon
          --no-parallel
          --stacktrace

      - name: Upload mainline debug APK
        uses: actions/upload-artifact@v4
        with:
          name: band-health-sync-mainline-debug
          path: app/build/outputs/apk/mainline/debug/app-mainline-debug.apk
          if-no-files-found: error
          retention-days: 14
